<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3 Chat Screens 💬</title>

<style>
body {
  margin: 0;
  background: #111;
  font-family: Arial, sans-serif;
  overflow: hidden;
  position: relative;
}

/* LIGHT EFFECT BG */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,105,180,0.25), transparent 40%),
    radial-gradient(circle at 70% 70%, rgba(255,20,147,0.2), transparent 40%);
  z-index: 0;
}

/* FLOATING HEARTS */
.hearts {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.bg-heart {
  position: absolute;
  bottom: -20px;
  animation: floatUp linear infinite;
  color: rgba(255,105,180,0.6);
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-100vh); opacity: 0; }
}

/* WRAPPER */
.apps-wrapper {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 20px;
  position: relative;
  z-index: 2;
}

/* APP */
.app {
  width: 320px;
  height: 90vh;
  background: #e5ddd5;
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header {
  background: #075e54;
  color: white;
  padding: 12px;
}

/* CHAT */
.chat {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

/* MESSAGE */
.msg {
  max-width: 230px;
  padding: 10px;
  border-radius: 10px;
  margin: 8px;
  font-size: 14px;
  position: relative;
  animation: fadeIn 0.3s ease;
}

/* LEFT = TEXT */
.left {
  background: white;
}

/* RIGHT = VOICE */
.right {
  background: #dcf8c6;
  margin-left: auto;
}

.time {
  font-size: 10px;
  color: gray;
  text-align: right;
}

/* VOICE */
.voice {
  display: flex;
  align-items: center;
  gap: 6px;
}

.right .voice {
  justify-content: flex-end;
}

/* PLAY BTN */
.play {
  width: 26px;
  height: 26px;
  background: #25d366;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  cursor: pointer;
}

/* WAVE */
.waveform {
  display: flex;
  gap: 2px;
}

.bar {
  width: 3px;
  height: 10px;
  background: #ccc;
}

.bar.active {
  background: #25d366;
}

/* REACTION */
.react-heart {
  position: absolute;
  bottom: -10px;
  right: 10px;
}

/* ANIMATION */
@keyframes fadeIn {
  from {opacity:0; transform: translateY(10px);}
  to {opacity:1; transform: translateY(0);}
}

/* 💖 FLOATING CONTINUE BUTTON */
.next-btn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  padding: 14px 28px;
  font-size: 15px;
  border: none;
  border-radius: 50px;
  cursor: pointer;

  /* Gradient Love Color */
  background: linear-gradient(45deg, #ff4d6d, #ff758f);
  color: white;

  /* Glow Effect */
  box-shadow: 0 0 15px rgba(255, 77, 109, 0.6),
              0 0 30px rgba(255, 77, 109, 0.4);

  transition: 0.3s;
  z-index: 999;
}

/* Hover Effect */
.next-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 25px rgba(255, 77, 109, 0.9),
              0 0 40px rgba(255, 77, 109, 0.6);
}

/* 💫 Floating Animation */
@keyframes floatBtn {
  0% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
  100% { transform: translateY(0); }
}

.next-btn {
  animation: floatBtn 2s infinite ease-in-out;
}

.chat {
  flex: 1;
  padding: 10px;
  overflow-y: auto;

  /* 🌸 CHAT WALLPAPER */
  background-image: url("images/WhatsApp.jpeg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  /* Optional overlay like WhatsApp */
  position: relative;
}

/* Optional: light overlay for better text visibility */
.chat::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.4);
  z-index: 0;
}

/* Keep messages above overlay */
.msg {
  position: relative;
  z-index: 1;
}
</style>
</head>

<body>

<div class="hearts"></div>

<div class="apps-wrapper">

  <div class="app">
    <div class="header">My Love 🤍</div>
    <div class="chat" id="chat1"></div>
  </div>

  <div class="app">
    <div class="header">My Love 🤍</div>
    <div class="chat" id="chat2"></div>
  </div>

  <div class="app">
    <div class="header">My Love 🤍</div>
    <div class="chat" id="chat3"></div>
  </div>

  <div class="app">
    <div class="header">My Love 🤍 </div>
    <div class="chat" id="chat4"></div>
  </div>

</div>

<!-- 💖 BUTTON -->
<button class="next-btn" onclick="goNext()">Continue ➝ 💖</button>

<script>

function goNext(){
  window.location.href = "cartoon.html";
}

const chats = [
  document.getElementById("chat1"),
  document.getElementById("chat2"),
  document.getElementById("chat3"),
  document.getElementById("chat4")
];


/* =========================================================
   ALL AUDIO PLAYERS
   ========================================================= */

const allAudios = [];


/* LEFT TEXT + RIGHT VOICE */

const messages1 = [
  {type:"text", side:"left", text:" Abee mah enaku ethum kadha slu mah..un voice ah ketute thoonganum pola iruku mah..edhum slu pakalm 💬"},
  {type:"voice", side:"right", audio:"audio/audio1.mp3"},
  {type:"voice", side:"right", audio:"audio/audio2.mp3"},
  {type:"voice", side:"right", audio:"audio/audio3.mp3"},
  {type:"voice", side:"right", audio:"audio/audio4.mp3"},
  {type:"voice", side:"right", audio:"audio/audio5.mp3"},
  {type:"voice", side:"right", audio:"audio/audio6.mp3"},

  {type:"text", side:"left", text:"Abee mah..Un voice ketta apdiyea beer adicha pola bothaiya iruka maari iruku"},
  {type:"text", side:"left", text:"Story ah apdiyea imagine pani paathu athum un voice la ketkurapo mahhh 😍"},
  {type:"text", side:"left", text:"Inaiku un voice semaiya Iruku abee mah enaku inum ketkanum polaiyea iruku..Na apdiyea ketutu un Mela paduthu apdiyea thoonguvn"},

  {type:"voice", side:"right", audio:"audio/audio7.mp3"},

  {type:"text", side:"left", text:"Luv u sooo much en abee mahhh🤍🫂💋...ummaahhhhhh💋"},
  {type:"voice", side:"right", audio:"audio/audio8.mp3"}
];


const messages2 = [
  {type:"text", side:"left", text:"Konjo neram matum voice panuviya un voice ketka asaiya iruk..Enak edhum voice panu mah atha sound ketutye thoongiren🤧"},

  {type:"voice", side:"right", audio:"audio/audio9.mp3"},
  {type:"voice", side:"right", audio:"audio/audio10.mp3"},
  {type:"voice", side:"right", audio:"audio/audio11.mp3"},
  {type:"voice", side:"right", audio:"audio/audio12.mp3"},
  {type:"voice", side:"right", audio:"audio/audio13.mp3"},
  {type:"voice", side:"right", audio:"audio/audio14.mp3"},

  {type:"text", side:"left", text:"Okay preethi mah ketka axhaga iruku mah ellam..Luv u en chlm😌🤌🏻🫂💋🤍✨"},
  {type:"voice", side:"right", audio:"audio/audio15.mp3"},
];


const messages3 = [
  {type:"text", side:"left", text:"Preethi mah..Un feel ah explain mah"},
  {type:"voice", side:"right", audio:"audio/audio16.mp3"},
  {type:"voice", side:"right", audio:"audio/audio17.mp3"},
  {type:"voice", side:"right", audio:"audio/audio18.mp3"},
  {type:"text", side:"left", text:"Luv u preethi mah 💋💋💋💋💋💋💋💋💋💋🤍🤌🏻🫂"},
  {type:"voice", side:"right", audio:"audio/audio19.mp3"},
];


const messages4 = [ 
  {type:"text", side:"left", text:"Ena epdi paathupa abee mah"}, 
  {type:"voice", side:"right", audio:"audio/audio21.mp3"}, 
  {type:"voice", side:"right", audio:"audio/audio20.mp3"}, 
  {type:"text", side:"left", text:"Alaga Iruku mah ne sluratha ketkurapo 💋🫂🤍😌✨una inum neraiya luv pananum abee mah enkita irukura motha luv um unaku kudukanum..Luv u abee mahh💋🫂🤍"}, {type:"voice", side:"right", audio:"audio/audio22.mp3"}, 
];


/* WAVE */

function createWave(){

  let wave = document.createElement("div");

  wave.className = "waveform";

  for(let i=0;i<20;i++){

    let bar = document.createElement("div");

    bar.className = "bar";

    wave.appendChild(bar);
  }

  return wave;
}


/* =========================================================
   STOP OTHER AUDIO
   ========================================================= */

function stopOtherAudios(currentAudio){

  allAudios.forEach(item => {

    if(item.audio !== currentAudio){

      item.audio.pause();

      item.audio.currentTime = 0;

      item.play.innerHTML = "▶";

      clearInterval(item.interval);

      item.i = 0;

      item.bars.forEach(bar => {
        bar.classList.remove("active");
      });

    }

  });

}


/* 💬 ADD MESSAGE */

function addMessage(chat, msg){

  let div = document.createElement("div");

  div.className = "msg " + msg.side;


  if(msg.type === "text"){

    div.innerHTML = msg.text + '<div class="time">✓✓</div>';

  }


  if(msg.type === "voice"){

    let voice = document.createElement("div");

    voice.className = "voice";


    let play = document.createElement("div");

    play.className = "play";

    play.innerHTML = "▶";


    let audio = document.createElement("audio");

    audio.src = msg.audio;


    let wave = createWave();

    let bars = wave.querySelectorAll(".bar");

    let interval = null;

    let i = 0;


    /* Store this audio */

    const audioObject = {
      audio: audio,
      play: play,
      interval: interval,
      i: i,
      bars: bars
    };

    allAudios.push(audioObject);


    /* =====================================================
       PLAY / PAUSE / RESUME
       ===================================================== */

    play.onclick = () => {


      /* ---------------------------------------------
         IF AUDIO IS CURRENTLY PLAYING
         --------------------------------------------- */

      if(!audio.paused){

        audio.pause();

        play.innerHTML = "▶";

        clearInterval(audioObject.interval);

        return;

      }


      /* ---------------------------------------------
         STOP ALL OTHER AUDIO
         --------------------------------------------- */

      stopOtherAudios(audio);


      /* ---------------------------------------------
         PLAY CURRENT AUDIO
         --------------------------------------------- */

      audio.play();

      play.innerHTML = "⏸";


      /* Start waveform */

      clearInterval(audioObject.interval);

      audioObject.interval = setInterval(() => {

        if(audioObject.i < bars.length){

          bars[audioObject.i].classList.add("active");

          audioObject.i++;

        }
        else{

          audioObject.i = 0;

          bars.forEach(bar => {
            bar.classList.remove("active");
          });

        }

      },100);

    };


    /* =====================================================
       AUDIO FINISHED
       ===================================================== */

    audio.onended = () => {

      play.innerHTML = "▶";

      clearInterval(audioObject.interval);

      audioObject.interval = null;

      audioObject.i = 0;

      bars.forEach(bar => {
        bar.classList.remove("active");
      });

    };


    /* =====================================================
       AUDIO ERROR
       ===================================================== */

    audio.onerror = () => {

      play.innerHTML = "▶";

      clearInterval(audioObject.interval);

      console.log("Audio could not be loaded:", msg.audio);

    };


    voice.appendChild(wave);

    voice.appendChild(play);

    div.appendChild(voice);

    div.appendChild(audio);

  }


  div.ondblclick = () => react(div);


  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

}


/* ❤️ REACTION */

function react(el){

  if(!el.querySelector(".react-heart")){

    let h = document.createElement("div");

    h.className = "react-heart";

    h.innerHTML = "❤️";

    el.appendChild(h);

  }

}


/* 💖 AUTO FLOW FOR EACH CHAT */

function runChat(chat, messages, delay){

  let i = 0;

  function next(){

    if(i < messages.length){

      addMessage(chat, messages[i]);

      i++;

      setTimeout(next, delay);

    }

  }

  next();

}


/* ▶ START ALL CHATS */

runChat(chat1, messages1, 2000);

runChat(chat2, messages2, 2500);

runChat(chat3, messages3, 3000);

runChat(chat4, messages4, 3000);


/* 💕 FLOAT HEARTS */

const hearts = document.querySelector(".hearts");


function createHeart(){

  const heart = document.createElement("div");

  heart.className = "bg-heart";

  heart.innerHTML = "💖";


  heart.style.left = Math.random() * 100 + "vw";

  heart.style.fontSize = (12 + Math.random() * 25) + "px";

  heart.style.animationDuration = (4 + Math.random() * 4) + "s";


  hearts.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);

}


setInterval(createHeart, 300);

</script>

</body>
</html>
