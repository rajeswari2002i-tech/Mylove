/* WAVE */

function createWave(){

  let wave = document.createElement("div");

  wave.className = "waveform";

  for(let i=0;i<20;i++){

    let bar = document.createElement("div");

    bar.className = "bar";

    wave.appendChild(bar);
  }

  return wave;
}


/* =========================================================
   STOP OTHER AUDIO
   ========================================================= */

function stopOtherAudios(currentAudio){

  allAudios.forEach(item => {

    if(item.audio !== currentAudio){

      item.audio.pause();

      item.audio.currentTime = 0;

      item.play.innerHTML = "▶";

      clearInterval(item.interval);

      item.i = 0;

      item.bars.forEach(bar => {
        bar.classList.remove("active");
      });

    }

  });

}


/* 💬 ADD MESSAGE */

function addMessage(chat, msg){

  let div = document.createElement("div");

  div.className = "msg " + msg.side;


  if(msg.type === "text"){

    div.innerHTML = msg.text + '<div class="time">✓✓</div>';

  }


  if(msg.type === "voice"){

    let voice = document.createElement("div");

    voice.className = "voice";


    let play = document.createElement("div");

    play.className = "play";

    play.innerHTML = "▶";


    let audio = document.createElement("audio");

    audio.src = msg.audio;


    let wave = createWave();

    let bars = wave.querySelectorAll(".bar");

    let interval = null;

    let i = 0;


    /* Store this audio */

    const audioObject = {
      audio: audio,
      play: play,
      interval: interval,
      i: i,
      bars: bars
    };

    allAudios.push(audioObject);


    /* =====================================================
       PLAY / PAUSE / RESUME
       ===================================================== */

    play.onclick = () => {


      /* ---------------------------------------------
         IF AUDIO IS CURRENTLY PLAYING
         --------------------------------------------- */

      if(!audio.paused){

        audio.pause();

        play.innerHTML = "▶";

        clearInterval(audioObject.interval);

        return;

      }


      /* ---------------------------------------------
         STOP ALL OTHER AUDIO
         --------------------------------------------- */

      stopOtherAudios(audio);


      /* ---------------------------------------------
         PLAY CURRENT AUDIO
         --------------------------------------------- */

      audio.play();

      play.innerHTML = "⏸";


      /* Start waveform */

      clearInterval(audioObject.interval);

      audioObject.interval = setInterval(() => {

        if(audioObject.i < bars.length){

          bars[audioObject.i].classList.add("active");

          audioObject.i++;

        }
        else{

          audioObject.i = 0;

          bars.forEach(bar => {
            bar.classList.remove("active");
          });

        }

      },100);

    };


    /* =====================================================
       AUDIO FINISHED
       ===================================================== */

    audio.onended = () => {

      play.innerHTML = "▶";

      clearInterval(audioObject.interval);

      audioObject.interval = null;

      audioObject.i = 0;

      bars.forEach(bar => {
        bar.classList.remove("active");
      });

    };


    /* =====================================================
       AUDIO ERROR
       ===================================================== */

    audio.onerror = () => {

      play.innerHTML = "▶";

      clearInterval(audioObject.interval);

      console.log("Audio could not be loaded:", msg.audio);

    };


    voice.appendChild(wave);

    voice.appendChild(play);

    div.appendChild(voice);

    div.appendChild(audio);

  }


  div.ondblclick = () => react(div);


  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

}


/* ❤️ REACTION */

function react(el){

  if(!el.querySelector(".react-heart")){

    let h = document.createElement("div");

    h.className = "react-heart";

    h.innerHTML = "❤️";

    el.appendChild(h);

  }

}


/* 💖 AUTO FLOW FOR EACH CHAT */

function runChat(chat, messages, delay){

  let i = 0;

  function next(){

    if(i < messages.length){

      addMessage(chat, messages[i]);

      i++;

      setTimeout(next, delay);

    }

  }

  next();

}
