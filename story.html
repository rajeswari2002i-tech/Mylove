/* TYPEWRITER CURSOR */
#typeText::after {
  content: "|";
  animation: blink 1s infinite;
  margin-left: 5px;
}

@keyframes blink {
  0%, 50%, 100% { opacity: 1; }
  25%, 75% { opacity: 0; }
}

/* SECTION ANIMATION */
.section {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 50px 20px;
  opacity: 0;
  transform: translateY(100px) scale(0.95);
  transition: all 1.2s ease;
}

.section.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.container {
  max-width: 1000px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 30px;
}

/* TEXT ANIMATION */
.text {
  flex: 1;
  padding: 25px;
  background: rgba(255, 255, 255, 0.4);
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  transition: 0.4s;
}
.text:hover {
  transform: translateY(-10px);
}

.section.show .text {
  opacity: 1;
  transform: translateX(0);
}

.text h2 {
  font-family: 'Playfair Display', serif;
  font-size: 2.5rem;
  margin-bottom: 15px;
  
}

.text p {
  font-size: 1.1rem;
  line-height: 1.6;
}

/* IMAGE ANIMATION */
.image {
  flex: 1;
  opacity: 0;
  transform: translateX(60px) scale(0.9);
  transition: all 1s ease;
}

.section.show .image {
  opacity: 1;
  transform: translateX(0) scale(1);
}

/* IMAGE STYLE */
.image img {
  width: 100%;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  transition: 0.5s;
  position: relative;
}

/* HOVER EFFECT */
.image img:hover {
  transform: scale(1.07) rotate(1deg);
  box-shadow: 0 0 40px rgba(255, 0, 100, 0.4);
}
html {
  scroll-behavior: smooth;
}

/* FLOATING EFFECT */
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

.section.show .image img {
  animation: float 4s ease-in-out infinite;
}

/* REVERSE FIX */
.reverse .text {
  transform: translateX(60px);
}

.reverse .image {
  transform: translateX(-60px) scale(0.9);
}

.section.show.reverse .text {
  transform: translateX(0);
}

.section.show.reverse .image {
  transform: translateX(0) scale(1);
}

/* FINAL SECTION */
.end {
  text-align: center;
  flex-direction: column;
}

.end h1 {

  font-size: 3rem;
  margin-bottom: 20px;

.btn:hover {

  <script>
    // Scroll animation
    const sections = document.querySelectorAll('.section');

    function reveal() {
      sections.forEach(section => {
        const top = section.getBoundingClientRect().top;
        const trigger = window.innerHeight - 100;

        if (top < trigger) {
          section.classList.add('show');
        }
      });
    }

    window.addEventListener('scroll', reveal);
    reveal();

    // Next page
    function nextPage() {
      window.location.href = "gallery.html";
    }
  </script>
  <script>
const elements = document.querySelectorAll(".typeText");

elements.forEach((el) => {
  const text = el.getAttribute("data-text");
  let i = 0;

  function typeWriter() {
    if (i < text.length) {
      el.innerHTML += text.charAt(i);
      i++;
      setTimeout(typeWriter, 30);
    }
  }

  const observer = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) {
      typeWriter();
      observer.disconnect();
    }
  });

  observer.observe(el);
});
</script>
<script>
const music = document.getElementById("bgMusic");

function toggleMusic(){
  if(music.paused){
    music.play();
    event.target.innerText = "⏸ Pause Music";
  } else {
    music.pause();
    event.target.innerText = "🎵 Play Music";
  }
}
</script>
