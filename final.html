<style>
  /* ===== BODY BACKGROUND ===== */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  color: #2b2b2b;

  background: radial-gradient(circle at 20% 30%, #f6c28b 0%, transparent 40%),
              radial-gradient(circle at 80% 70%, #5a2a4d 0%, transparent 50%),
              linear-gradient(120deg, #f6c28b, #5a2a4d);
  background-attachment: fixed;
  overflow-x: hidden;

  animation: gradientShift 12s ease-in-out infinite alternate;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 60%);
  pointer-events: none;
}

/* ===== MAIN LAYOUT ===== */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100vh;
}

/* ===== LEFT SIDE ===== */
.left {
  padding: 30px;
  display: flex;
  flex-direction: column;
  gap: 40px;
  overflow-y: auto;
}

/* ===== POLAROID ===== */
.polaroid {
  background: linear-gradient(145deg, #2a1a12, #1a0f0a);
  padding: 12px 12px 30px;
  border-radius: 14px;
  width: 90%;
  position: relative;
  transition: 0.4s;

  border: 1px solid rgba(255, 215, 130, 0.4);

  box-shadow: 
    0 10px 25px rgba(0,0,0,0.5),
    0 0 20px rgba(255, 200, 120, 0.25),
    inset 0 0 15px rgba(255, 220, 150, 0.08);
}

/* GOLD EDGE */
.polaroid::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 16px;
  background: linear-gradient(45deg, #ffd27f, #ff9a6c, #ffd27f);
  z-index: -1;
  filter: blur(10px);
  opacity: 0.7;
}

.polaroid img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  border-radius: 10px;
}

/* CAPTION */
.caption {
  text-align: center;
  margin-top: 10px;
  font-size: 14px;
  color: #f7d9a5;
}

/* TILT */
.polaroid:nth-child(odd) { transform: rotate(-3deg); }
.polaroid:nth-child(even) { transform: rotate(3deg); }

.polaroid:hover {
  transform: scale(1.06) rotate(0deg);
  box-shadow: 
    0 20px 50px rgba(0,0,0,0.7),
    0 0 40px rgba(255, 200, 120, 0.6);
}

/* ===== RIGHT SIDE ===== */
.right {
  position: relative;
  overflow: hidden;
  padding-right: 40px;

  background: linear-gradient(
    to left,
    rgba(0,0,0,0.15),
    transparent
  );
}

.scroll {
  display: flex;
  flex-direction: column;
  gap: 25px;
  animation: scrollUp 80s linear infinite;
  padding: 20px;
}

.scroll:hover {
  animation-play-state: paused;
}

/* ===== IMAGE BOX ===== */
.img-box {
  position: relative;
  width: 65%;
  margin-left: auto;
  border-radius: 20px;
  overflow: hidden;

  border: 1px solid rgba(255, 215, 130, 0.6);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.6),
    0 0 25px rgba(255, 200, 120, 0.35);

  transition: 0.4s;
}

.img-box img {
  width: 100%;
  height: 420px;
  object-fit: cover;
  border-radius: 20px;
  display: block;
}

/* GOLD GLOW */
.img-box::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 22px;
  background: linear-gradient(45deg, #ffd27f, #ff9a6c, #ffd27f);
  z-index: -1;
  filter: blur(10px);
  opacity: 0.7;
}

/* LIGHT SWEEP */
.img-box::after {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 60%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.7),
    transparent
  );
  transform: skewX(-25deg);
}

.img-box:hover::after {
  animation: sweep 1s ease;
}

.img-box:hover {
  transform: scale(1.05);
  box-shadow:
    0 20px 50px rgba(0,0,0,0.8),
    0 0 40px rgba(255, 200, 120, 0.6);
}

/* ===== BUTTON ===== */
.next-btn {
  position: fixed;
  bottom: 30px;
  right: 40px;
  padding: 12px 25px;
  background: linear-gradient(45deg, #ff4d6d, #ff758f);
  color: white;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 5px 20px rgba(255, 77, 109, 0.5);
}

/* ===== PARTICLES ===== */
.particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.6), transparent),
    radial-gradient(2px 2px at 70% 60%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,0.4), transparent),
    radial-gradient(2px 2px at 90% 20%, rgba(255,255,255,0.5), transparent);
  animation: sparkleMove 20s linear infinite;
}

/* ===== ANIMATIONS ===== */
@keyframes scrollUp {
  0% { transform: translateY(0); }
  100% { transform: translateY(-50%); }
}

@keyframes sweep {
  from { left: -120%; }
  to { left: 120%; }
}

@keyframes sparkleMove {
  from { transform: translateY(0); }
  to { transform: translateY(-200px); }
}

@keyframes gradientShift {
  0% { background-position: left; }
  100% { background-position: right; }
}

/* ===== MOBILE ===== */
@media(max-width:768px){
  .container { grid-template-columns: 1fr; }
  .img-box { width: 100%; }
}
</style>
</head>
